# Local databases for TripSignal: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tripsignal
      POSTGRES_PASSWORD: tripsignal
      POSTGRES_DB: tripsignal
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
volumes:
  pgdata:
  mongodata:
