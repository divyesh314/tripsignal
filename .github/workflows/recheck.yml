# Calls the app every hour so upcoming trips get re-checked.
# Needs two repository secrets: APP_URL (e.g. https://tripsignal.vercel.app) and CRON_SECRET.
name: Hourly trip re-check
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Call the re-check endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set; skipping."; exit 0; fi
          curl --fail-with-body -sS -X POST "$APP_URL/api/cron/recheck" \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 90
